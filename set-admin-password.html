<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Définir le mot de passe admin - HTML Master</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <h1 class="logo">HTML Master</h1>
            <ul class="nav-links">
                <li><a href="index.html">Accueil</a></li>
                <li><a href="programme.html">Programme</a></li>
                <li><a href="login.html">Connexion</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <div class="form-container">
            <h2>Définir votre mot de passe administrateur</h2>
            <p style="text-align: center; margin-bottom: 1.5rem; color: #e74c3c;">
                ⚠️ Une fois défini, vous ne pourrez plus changer ce mot de passe.
            </p>
            <div id="message"></div>
            <form id="setPasswordForm">
                <div class="form-group">
                    <label for="password">Mot de passe :</label>
                    <input type="password" id="password" required placeholder="********">
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirmer le mot de passe :</label>
                    <input type="password" id="confirmPassword" required placeholder="********">
                </div>
                <div class="form-group">
                    <button type="submit">Définir le mot de passe</button>
                </div>
            </form>
        </div>
    </div>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 HTML Master. Tous droits réservés.</p>
        </div>
    </footer>

    <script src="js/auth.js"></script>
    <script>
        document.getElementById('setPasswordForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const messageDiv = document.getElementById('message');

            // Validation
            if (password !== confirmPassword) {
                showMessage('Les mots de passe ne correspondent pas', 'error');
                return;
            }

            if (password.length < 6) {
                showMessage('Le mot de passe doit contenir au moins 6 caractères', 'error');
                return;
            }

            // Définir le mot de passe admin
            const success = await setAdminPassword(password);

            if (success) {
                showMessage('Mot de passe défini avec succès ! Vous pouvez maintenant vous connecter.', 'success');
                document.getElementById('setPasswordForm').reset();

                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
            } else {
                showMessage('Erreur lors de la définition du mot de passe', 'error');
            }
        });

        function showMessage(message, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.innerHTML = `<div class="message ${type}">${message}</div>`;
        }
    </script>
</body>
</html>
